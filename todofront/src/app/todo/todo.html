<main class="site-page">
  <section class="content-card">
    <p>Todo integration</p>
    <div class="div-todo">
      <form class="todo-form">
        <input type="text" class="todo-input" placeholder="Type your todo name" required />
        <input type="text" class="todo-input-description" placeholder="Type todo description" required />
      </form>
      <button
          type="button"
          class="site-add-button"
          >Add</button>
    </div>
  </section>

</main>

<div cdkDropListGroup class="todo-container">

  <table class="todo-table paused-table">
    <thead class="thead-paused">
      <tr>
        <th class="PAUSED">PAUSED</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <table class="todo-table todos-table">
    <thead class="thead-todos">
      <tr>
        <th class="TODOS">TODOS</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <table class="todo-table done-table">
    <thead class="thead-done">
      <tr>
        <th class="DONE">DONE</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

</div>
