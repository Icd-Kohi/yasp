<main class="site-page">
  <section class="content-card">
    <p>Todo integration</p>
    <div class="div-todo">
      <form class="todo-form"
        [formGroup]="todoCatalogForm"
        (submit)="submit()"
        >
        <input type="text" class="todo-input" placeholder="Type your todo name" formControlName="name" maxlength="50"/>
        <input type="text" class="todo-input-description" placeholder="Type todo description" formControlName="description" maxlength="100"/>
      <button
          type="submit"
          class="site-add-button"
          [disabled]="isSavingTodo()"
          >{{ isSavingTodo() ? 'Saving...' : 'Add'}}</button>
      </form>
    </div>
  </section>

</main>

<div cdkDropListGroup class="todo-container">

  <table class="todo-table paused-table">
    <thead class="thead-paused">
      <tr>
        <th class="PAUSED">PAUSED</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <table class="todo-table todos-table">
    <thead class="thead-todos">
      <tr>
        <th class="TODOS">TODOS</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <table class="todo-table done-table">
    <thead class="thead-done">
      <tr>
        <th class="DONE">DONE</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

</div>
